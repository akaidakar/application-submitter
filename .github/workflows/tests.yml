name: tests

# push already covers branches in this repository, so a pull_request trigger
# would only run the same suite a second time.
on:
  push:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        # The published-digest test signs with the real key. Without the secret
        # that one test is skipped and the rest still run.
        env:
          B12_SIGNING_SECRET: ${{ secrets.B12_SIGNING_SECRET }}
        run: pytest -v
