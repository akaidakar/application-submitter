name: submit application

on:
  workflow_dispatch:
    inputs:
      # No defaults: a fork inherits them, and a forker who left them alone
      # would submit someone else's details.
      name:
        description: "Applicant's full name"
        type: string
        required: true
      email:
        description: "Applicant's email address"
        type: string
        required: true
      resume_link:
        description: "Public URL of a résumé or LinkedIn profile"
        type: string
        required: true
      dry_run:
        description: "Print the signed body without posting it"
        type: boolean
        default: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  submit:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit
        # Inputs go through env rather than straight into the command line so
        # a quote or a shell character typed into the form cannot break out.
        # dry_run is the exception: it is a boolean, so the expression below
        # can only ever expand to "--dry-run" or nothing.
        env:
          B12_SIGNING_SECRET: ${{ secrets.B12_SIGNING_SECRET }}
          APPLICANT_NAME: ${{ inputs.name }}
          APPLICANT_EMAIL: ${{ inputs.email }}
          APPLICANT_RESUME_LINK: ${{ inputs.resume_link }}
        run: >
          python submit_application.py
          --name "$APPLICANT_NAME"
          --email "$APPLICANT_EMAIL"
          --resume-link "$APPLICANT_RESUME_LINK"
          ${{ inputs.dry_run && '--dry-run' || '' }}
