# Submitting is manual on purpose. The endpoint belongs to someone else and the
# POST is not idempotent, so it is not something to fire on every push.
name: submit application

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the signed body without posting it"
        type: boolean
        default: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  submit:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit
        env:
          B12_SIGNING_SECRET: ${{ secrets.B12_SIGNING_SECRET }}
        run: python submit_application.py ${{ inputs.dry_run && '--dry-run' || '' }}
